<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -80 240 520" width="240" height="520">
  <!--
    The batter in his stance, as the catcher sees him: a right-hander in the
    left-hand box, facing the plate (to the right), front shoulder towards the
    pitcher, head turned to watch the pitcher. We see his right side and a
    little of his chest. Athletic crouch: hips back, knees flexed, leaning a
    little over the plate.

    Drawn in "art units": 200 units = 1 metre, feet on the ground at y = 420.
    Uniform colours come from the CSS variable --jersey (default blue), so he
    can wear any player's colour. The number on his helmet is the <tspan>.
  -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8743a" />
      <stop offset="0.45" stop-color="#e0a867" />
      <stop offset="1" stop-color="#a8652e" />
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4d9e1" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e6e9ee" />
    </linearGradient>
    <linearGradient id="jerseyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(0 0 0 / 0.22)" />
      <stop offset="0.55" stop-color="rgb(0 0 0 / 0)" />
      <stop offset="1" stop-color="rgb(0 0 0 / 0.1)" />
    </linearGradient>
  </defs>

  <!-- Shadow on the dirt -->
  <ellipse cx="112" cy="421" rx="70" ry="9" fill="rgb(0 0 0 / 0.22)" />

  <!-- Front (left) leg: further away, towards the pitcher, peeking out behind the back leg -->
  <path d="M90 248 C80 272 76 298 80 318 C82 340 86 358 88 374 L92 394 L108 394 L106 374 C106 354 104 336 102 318 C102 296 108 274 112 254 Z" fill="#dde2e8" />
  <path d="M88 374 L92 394 L108 394 L106 374 Z" fill="var(--jersey, #1f9bf0)" />
  <path d="M88 374 L92 394 L108 394 L106 374 Z" fill="rgb(0 0 0 / 0.35)" />
  <path d="M84 392 Q80 404 88 407 L122 407 Q126 398 112 392 Z" fill="#1d2733" />

  <!-- Seat and hips: sitting back, his back to our left -->
  <path d="M74 236 Q68 258 82 272 Q106 280 132 266 L138 232 Z" fill="url(#pants)" />

  <!-- Back (right) leg, nearest us: thigh angled down towards the plate to a bent knee, shin back to the foot -->
  <path d="M88 240 C92 272 110 300 128 318 C136 328 134 352 130 372 L126 404 L146 404 L150 372 C154 344 154 324 144 306 C130 282 124 258 124 236 Z" fill="url(#pants)" />
  <path d="M118 316 Q130 308 142 316" fill="none" stroke="rgb(0 0 0 / 0.12)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Piping down the side of his trousers -->
  <path d="M89 246 C93 276 110 302 127 320 C134 330 132 352 129 370" fill="none" stroke="var(--jersey, #1f9bf0)" stroke-width="3.5" stroke-linecap="round" />
  <!-- High socks, and a cleat pointing at the plate -->
  <path d="M130 372 L126 404 L146 404 L150 372 Z" fill="var(--jersey, #1f9bf0)" />
  <path d="M121 402 Q115 418 125 421 L166 421 Q172 412 155 403 Z" fill="#1d2733" />
  <path d="M128 411 L154 411 L152 415 L128 415 Z" fill="#ffffff" opacity="0.85" />

  <!-- Belt -->
  <path d="M76 226 L140 230 L139 240 L76 236 Z" fill="#1d2733" />

  <!-- Torso, side-on and leaning over the plate: back on our left, chest on our right -->
  <path d="M82 138 Q88 120 108 116 L134 118 Q156 124 158 150 Q158 180 150 204 Q144 220 140 232 L78 228 Q76 204 76 180 Q76 156 82 138 Z" fill="var(--jersey, #1f9bf0)" />
  <path d="M82 138 Q88 120 108 116 L134 118 Q156 124 158 150 Q158 180 150 204 Q144 220 140 232 L78 228 Q76 204 76 180 Q76 156 82 138 Z" fill="url(#jerseyShade)" />
  <!-- The jersey's button line down the front -->
  <path d="M150 136 Q154 176 142 226" fill="none" stroke="rgb(0 0 0 / 0.12)" stroke-width="2" />

  <!-- Neck -->
  <path d="M118 104 L136 106 L136 124 L116 122 Z" fill="#d9a07a" />
  <!-- Helmet: the back and right side, the ear flap over his right ear, the brim
       pointing towards the pitcher, and his number -->
  <circle cx="126" cy="88" r="27" fill="var(--jersey, #1f9bf0)" />
  <circle cx="126" cy="88" r="27" fill="rgb(0 0 0 / 0.22)" />
  <path d="M146 78 Q160 76 164 86 L148 90 Z" fill="var(--jersey, #1f9bf0)" />
  <path d="M146 78 Q160 76 164 86 L148 90 Z" fill="rgb(0 0 0 / 0.42)" />
  <path d="M120 96 Q136 94 142 106 Q134 118 120 112 Z" fill="var(--jersey, #1f9bf0)" />
  <path d="M120 96 Q136 94 142 106 Q134 118 120 112 Z" fill="rgb(0 0 0 / 0.32)" />
  <path d="M104 82 Q108 66 124 62" fill="none" stroke="rgb(255 255 255 / 0.45)" stroke-width="5" stroke-linecap="round" />
  <text x="110" y="100" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" opacity="0.9">
    <tspan class="number">1</tspan>
  </text>

  <!-- The bat: in his hands at ear height, angled up and back across the top of
       his helmet. From behind the plate it's in full view, in front of the helmet. -->
  <g transform="translate(152 104) rotate(-50)">
    <path d="M-3.2 14 L-3.6 -60 Q-7.5 -118 -7.5 -158 A7.5 7.5 0 0 1 7.5 -158 Q7.5 -118 3.6 -60 L3.2 14 Z" fill="url(#wood)" />
  </g>

  <!-- Front (left) arm: upper arm from the front of his chest down towards
       the plate, forearm back up to the hands -->
  <path d="M146 136 Q164 150 168 164" fill="none" stroke="var(--jersey, #1f9bf0)" stroke-width="19" stroke-linecap="round" />
  <path d="M146 136 Q164 150 168 164" fill="none" stroke="rgb(0 0 0 / 0.3)" stroke-width="19" stroke-linecap="round" />
  <path d="M168 164 Q172 140 158 116" fill="none" stroke="#d9a07a" stroke-width="15" stroke-linecap="round" />

  <!-- Back (right) arm, nearest us: upper arm hanging down and a little back
       from the shoulder, forearm a long diagonal up to the hands -->
  <path d="M108 132 Q98 150 102 170" fill="none" stroke="rgb(0 0 0 / 0.25)" stroke-width="28" stroke-linecap="round" />
  <path d="M108 132 Q98 150 102 170" fill="none" stroke="var(--jersey, #1f9bf0)" stroke-width="24" stroke-linecap="round" />
  <path d="M108 132 Q98 150 102 170" fill="none" stroke="rgb(0 0 0 / 0.1)" stroke-width="24" stroke-linecap="round" />
  <path d="M102 170 Q124 150 138 112" fill="none" stroke="#e8b48c" stroke-width="17" stroke-linecap="round" />
  <!-- Hands gripping the bat in batting gloves, drawn along the bat (same angle).
       The bottom (left) hand sits just above the knob, the top (right) hand
       right above it, fingers curled round the handle. We see the back of the
       top hand and the palm side of the bottom one. -->
  <g transform="translate(152 104) rotate(-50)">
    <!-- The end of the handle and its knob, poking out below his bottom hand
         (drawn over his arms so it's never hidden) -->
    <path d="M-3.2 8 L-3.1 18 L3.1 18 L3.2 8 Z" fill="url(#wood)" />
    <ellipse cx="0" cy="19" rx="6.5" ry="3.5" fill="#8a5a2b" />
    <ellipse cx="0" cy="18.2" rx="5" ry="2" fill="#a86e36" />
    <!-- Bottom (left) hand -->
    <g>
      <!-- Wrist cuff -->
      <rect x="-20" y="-3" width="8" height="16" rx="3" fill="var(--jersey, #1f9bf0)" />
      <rect x="-20" y="-3" width="8" height="16" rx="3" fill="rgb(0 0 0 / 0.25)" />
      <!-- Heel of the palm: we see the palm side of this hand -->
      <path d="M-13 -3 L2 -3.4000000000000004 Q6 -3.1999999999999993 6 5 Q6 13.2 2 13.4 L-13 13 Z" fill="#ffffff" stroke="rgb(0 0 0 / 0.2)" stroke-width="1" />
      <!-- Four fingers curled round the bat, knuckles showing -->
      <g fill="#ffffff" stroke="rgb(0 0 0 / 0.22)" stroke-width="0.9">
      <rect x="0" y="-3.0" width="8.5" height="3.8" rx="1.9" /><path d="M5.0 -2.5 L5.0 0.3" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="1.0" width="9.5" height="3.8" rx="1.9" /><path d="M6.0 1.5 L6.0 4.3" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="5.0" width="9.2" height="3.8" rx="1.9" /><path d="M5.7 5.5 L5.7 8.3" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="9.0" width="8" height="3.8" rx="1.9" /><path d="M4.5 9.5 L4.5 12.3" stroke="rgb(0 0 0 / 0.25)" />
      </g>
    </g>
    <!-- Top (right) hand -->
    <g>
      <!-- Wrist cuff -->
      <rect x="-20" y="-20" width="8" height="16" rx="3" fill="var(--jersey, #1f9bf0)" />
      <rect x="-20" y="-20" width="8" height="16" rx="3" fill="rgb(0 0 0 / 0.25)" />
      <!-- Back of the hand, wrapping round the handle -->
      <path d="M-13 -20 L2 -20.4 Q6 -20.2 6 -12 Q6 -3.8000000000000007 2 -3.5999999999999996 L-13 -4 Z" fill="#ffffff" stroke="rgb(0 0 0 / 0.2)" stroke-width="1" />
      <!-- A leather patch on the back of the glove -->
      <rect x="-11" y="-16.5" width="7" height="9" rx="2.5" fill="var(--jersey, #1f9bf0)" opacity="0.75" />
      <!-- Four fingers curled round the bat, knuckles showing -->
      <g fill="#ffffff" stroke="rgb(0 0 0 / 0.22)" stroke-width="0.9">
      <rect x="0" y="-20.0" width="8.5" height="3.8" rx="1.9" /><path d="M5.0 -19.5 L5.0 -16.7" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="-16.0" width="9.5" height="3.8" rx="1.9" /><path d="M6.0 -15.5 L6.0 -12.7" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="-12.0" width="9.2" height="3.8" rx="1.9" /><path d="M5.7 -11.5 L5.7 -8.7" stroke="rgb(0 0 0 / 0.25)" />
      <rect x="0" y="-8.0" width="8" height="3.8" rx="1.9" /><path d="M4.5 -7.5 L4.5 -4.7" stroke="rgb(0 0 0 / 0.25)" />
      </g>
    </g>
    <!-- Left thumb, as in a fist: from the base of the thumb on the wrist side
         of his palm, it wraps round the handle and lies across the front of his
         index and middle fingers. (The right thumb is round the far side, out of sight.) -->
    <path d="M-4 -1.5 C-1.5 -4.2 2.8 -3.8 4.2 0.4" fill="none" stroke="rgb(0 0 0 / 0.24)" stroke-width="4.7" stroke-linecap="round" />
    <path d="M-4 -1.5 C-1.5 -4.2 2.8 -3.8 4.2 0.4" fill="none" stroke="#ffffff" stroke-width="3.7" stroke-linecap="round" />
    <path d="M1.5 -3.4 L2.2 -2" fill="none" stroke="rgb(0 0 0 / 0.2)" stroke-width="0.9" />
  </g>
</svg>
